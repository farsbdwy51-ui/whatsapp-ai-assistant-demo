<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>قطن ستور — المساعد الذكي لخدمة العملاء (ديمو)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="phone">
    <header>
      <div class="avatar">ق</div>
      <div class="hinfo">
        <div class="hname">قطن ستور <span class="verified">✔</span></div>
        <div class="hstatus">متصل الآن</div>
        <div id="mode"></div>
      </div>
      <button id="reset" title="إعادة الديمو من الأول">↺</button>
    </header>

    <main id="chat"></main>

    <div id="chips"></div>

    <div id="inputbar">
      <input id="input" type="text" placeholder="اكتب رسالتك هنا..." autocomplete="off" />
      <button id="send" title="إرسال">➤</button>
    </div>
  </div>

  <script src="js/catalog.js"></script>
  <script src="js/engine.js"></script>
  <!-- config.js اختياري: انسخه من config.example.js وحط مفتاح OpenRouter -->
  <script src="config.js" onerror="window.APP_CONFIG=window.APP_CONFIG||{}"></script>
  <script src="js/llm-adapter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
